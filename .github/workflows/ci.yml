name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, compile, tests and CLI contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - name: Check out orchestrator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19.x"
          otp-version: "28.x"

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Run tests and coverage contract
        run: mix test --cover

      - name: Validate registry and executable
        run: |
          mix escript.build
          ./spectre-ecosystem validate
          ./spectre-ecosystem plan \
            --spectre-ref test-ref \
            --campaign-id ci-contract \
            --format github-matrix >/dev/null
