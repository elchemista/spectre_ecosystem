name: Watch Spectre core releases

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Compatibility profile for a newly observed release
        required: true
        default: full
        type: choice
        options: [compat, full]
      packages:
        description: Comma-separated package names or all
        required: true
        default: all
        type: string
      dry_run:
        description: Observe without dispatching
        required: true
        default: false
        type: boolean
      retry_failed:
        description: Re-dispatch a previously failed campaign
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: watch-spectre-core-release
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out orchestrator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19.x"
          otp-version: "28.x"

      - name: Build dependency-free CLI
        env:
          MIX_ENV: prod
        run: mix escript.build

      - name: Observe latest core release
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile || 'full' }}
          PACKAGES: ${{ inputs.packages || 'all' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          RETRY_FAILED: ${{ inputs.retry_failed || false }}
        run: |
          args=(watch --profile "$PROFILE" --packages "$PACKAGES")
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$RETRY_FAILED" == "true" ]]; then args+=(--retry-failed); fi
          ./spectre-ecosystem "${args[@]}"
